services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=${DB_USER:-odoo}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - POSTGRES_DB=${DB_NAME:-odoo}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  odoo17:
    image: odoo:17.0
    depends_on:
      - db
    ports:
      - "8095:8069"
    environment:
      - HOST=db
      - USER=${DB_USER:-odoo}
      - PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:-odoo}
      - DB_FILTER=${DB_NAME:-odoo}
    volumes:
      - ./odoo:/mnt/extra-addons/odoo
      - ./addons:/mnt/extra-addons/addons
      - ./odoo_module:/mnt/extra-addons/odoo_module
      - ./config:/etc/odoo
      - odoo-web-data:/var/lib/odoo
    command: -- --database=${DB_NAME:-odoo} --db_host=db --db_user=${DB_USER:-odoo} --db_password=${DB_PASSWORD} --init=base
    restart: always

volumes:
  odoo-db-data:
  odoo-web-data: